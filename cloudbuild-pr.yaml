steps:
  # 1. AI検閲官コンテナの実行
  - name: 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/infra-tools/ai-verifier:latest'
    entrypoint: 'python'
    args: ['scripts/pr_reviewer.py']
    secretEnv: ['GITHUB_TOKEN', 'DATADOG_API_KEY']
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'PR_NUMBER=$_PR_NUMBER'
      - 'REPO_FULL_NAME=$REPO_FULL_NAME'
      - 'COMMIT_SHA=$COMMIT_SHA'
      # Datadogを無効化する場合は DATADOG_ENABLED=false に変更する（デフォルト: true）
      - 'DATADOG_ENABLED=true'
      # PR時に動的に取得したワークスペースをPYTHONPATH等に通すことも可能だが、
      # コンテナの entrypoint でワークスペース内のスクリプトを直接実行する。
    dir: '.' # ソースコードがマウントされたディレクトリ

  # 2. AI検閲官の回帰テスト（条件付き強制ゲート）
  #    検閲基準（.clinerules / 判例集 / プロンプト / evals/）を変更する PR でのみ
  #    ゴールデンセット eval を実行し、全ケース合格しないとビルドを fail させる。
  #    「ルール変更前に手で eval を打つ」運用の打ち忘れを構造的に排除する。
  #    認証は本ビルドの SA によるメタデータ ADC（検閲官と同一・新規資格情報なし）。
  #    詳細は evals/README.md を参照。
  - name: 'node:20'
    entrypoint: 'bash'
    args: ['scripts/run_evals_ci.sh']
    secretEnv: ['GITHUB_TOKEN']
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'PR_NUMBER=$_PR_NUMBER'
      - 'REPO_FULL_NAME=$REPO_FULL_NAME'
    dir: '.'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-token-pr-reviewer/versions/latest
      env: 'GITHUB_TOKEN'
    - versionName: projects/$PROJECT_ID/secrets/infra-datadog-api-key/versions/latest
      env: 'DATADOG_API_KEY'

options:
  logging: CLOUD_LOGGING_ONLY
