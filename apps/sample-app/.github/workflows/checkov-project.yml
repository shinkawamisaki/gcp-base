name: 'Security: Checkov (Project Strict)'

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/checkov-project.yml'
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/checkov-project.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  checkov-project:
    name: 'Checkov Project Strict'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov (hard fail)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          quiet: true
          soft_fail: false
          hard_fail_on: MEDIUM,HIGH,CRITICAL
          output_format: cli,sarif
          output_file_path: console,results-project.sarif
          config_file: .checkov.yaml

      - name: Upload SARIF
        # 非公開リポは、code scanning（GitHub Advanced Security）が無いと送信が失敗し、実行のたびに
        # 赤い注釈が付く。公開リポでだけ送る。code scanning を契約した非公開リポで送る場合は、
        # 下の条件から「&& !github.event.repository.private」を外す。
        if: always() && !github.event.repository.private
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results-project.sarif
