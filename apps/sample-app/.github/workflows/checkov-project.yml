name: 'Security: Checkov (Project Strict)'

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/checkov-project.yml'
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/checkov-project.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  checkov-project:
    name: 'Checkov Project Strict'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov (hard fail)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          quiet: true
          soft_fail: false
          hard_fail_on: MEDIUM,HIGH,CRITICAL
          output_format: cli,sarif
          output_file_path: console,results-project.sarif

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results-project.sarif
