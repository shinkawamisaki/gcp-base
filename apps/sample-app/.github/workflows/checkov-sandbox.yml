name: 'Security: Checkov (Sandbox Relaxed)'

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/checkov-sandbox.yml'
  push:
    branches:
      - 'sandbox/**'
    paths:
      - 'infra/**'
      - '.github/workflows/checkov-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  checkov-sandbox-advisory:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'sandbox/')
    name: 'Checkov Sandbox Advisory'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov (advisory)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          quiet: true
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results-sandbox-advisory.sarif
          config_file: .checkov.yaml

      - name: Upload SARIF (advisory)
        # 非公開リポは、code scanning（GitHub Advanced Security）が無いと送信が失敗し、実行のたびに
        # 赤い注釈が付く。公開リポでだけ送る。code scanning を契約した非公開リポで送る場合は、
        # 下の条件から「&& !github.event.repository.private」を外す。
        if: always() && !github.event.repository.private
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results-sandbox-advisory.sarif

  checkov-sandbox-critical:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'sandbox/')
    name: 'Checkov Sandbox Critical Guardrail'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov (critical only hard fail)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          quiet: true
          soft_fail: false
          hard_fail_on: HIGH,CRITICAL
          output_format: cli,sarif
          output_file_path: console,results-sandbox-critical.sarif
          config_file: .checkov.yaml

      - name: Upload SARIF (critical)
        # 非公開リポは、code scanning（GitHub Advanced Security）が無いと送信が失敗し、実行のたびに
        # 赤い注釈が付く。公開リポでだけ送る。code scanning を契約した非公開リポで送る場合は、
        # 下の条件から「&& !github.event.repository.private」を外す。
        if: always() && !github.event.repository.private
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results-sandbox-critical.sarif
