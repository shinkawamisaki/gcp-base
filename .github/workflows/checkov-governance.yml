name: 'Security: Checkov (Governance + Modules, CIS GCP)'

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - 'governance/**'
      - 'modules/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  checkov-governance:
    name: 'Checkov Governance (CIS GCP Strict)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tf:
              - 'governance/**'
              - '.github/workflows/checkov-governance.yml'

      - name: Run Checkov on governance/ (CIS GCP)
        if: steps.filter.outputs.tf == 'true'
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: governance
          framework: terraform
          check: CKV_GCP_*
          quiet: true
          soft_fail: false
          hard_fail_on: MEDIUM,HIGH,CRITICAL
          output_format: cli,sarif
          output_file_path: console,results-governance.sarif
          config_file: .checkov.yaml

      - name: Upload SARIF (governance)
        if: steps.filter.outputs.tf == 'true' && always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results-governance.sarif
          category: checkov-governance

      - name: Skip (no Terraform changes)
        if: steps.filter.outputs.tf == 'false'
        run: echo "No changes in governance/ — Checkov skipped"

  checkov-modules:
    name: 'Checkov Modules (CIS GCP Strict)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tf:
              - 'modules/**'
              - '.github/workflows/checkov-governance.yml'

      - name: Run Checkov on modules/ (CIS GCP)
        if: steps.filter.outputs.tf == 'true'
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules
          framework: terraform
          check: CKV_GCP_*
          quiet: true
          soft_fail: false
          hard_fail_on: MEDIUM,HIGH,CRITICAL
          output_format: cli,sarif
          output_file_path: console,results-modules.sarif
          config_file: .checkov.yaml

      - name: Upload SARIF (modules)
        if: steps.filter.outputs.tf == 'true' && always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results-modules.sarif
          category: checkov-modules

      - name: Skip (no Terraform changes)
        if: steps.filter.outputs.tf == 'false'
        run: echo "No changes in modules/ — Checkov skipped"
