name: 'Security: Secret Scan (gitleaks)'

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: 'Detect Secrets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全履歴をスキャン（PRの差分だけでなく過去commitも検知）

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact

  oss-invariants:
    name: 'OSS Invariants (OPS-002)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 内部判例ログ logs/ は本 OSS テンプレ(PUBLIC)では追跡しない（判例 OPS-002）。
      # 反映ミス等で logs/judgments.md・active_rules.md が混入すると、非公開リポの
      # 内部判断が公開されてしまう。記憶でなく CI で機械的に不変条件を守る。
      # （差分の全体像は project-23378 の docs/REPO_DIVERGENCE.md を参照）
      - name: 'logs/ は追跡しない (OPS-002)'
        run: |
          tracked=$(git ls-files logs/)
          if [ -n "$tracked" ]; then
            echo "::error::内部判例ログ logs/ が PUBLIC テンプレで追跡されています（OPS-002 違反）。以下を git rm --cached で外してください:"
            echo "$tracked"
            exit 1
          fi
          echo "[OK] logs/ は未追跡（OPS-002 準拠）"
