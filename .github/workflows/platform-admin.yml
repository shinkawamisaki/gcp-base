name: 'GCP Foundation: Admin Deployment'

on:
  push:
    branches: [ main ]
    paths:
      - 'governance/admin/**'
      - 'infra/**'
      - 'modules/**'
      - 'scripts/**'
      - '.github/workflows/platform-admin.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # 0. 変更検知
  check-changes:
    name: 'Check Changes'
    runs-on: ubuntu-latest
    outputs:
      foundation: ${{ steps.filter.outputs.foundation }}
      factory: ${{ steps.filter.outputs.factory }}
      inventory_changed: ${{ steps.filter.outputs.inventory_changed }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            foundation:
              - 'governance/admin/foundation/**'
              - 'modules/api_base/**'
              - 'modules/billing_base/**'
              - 'modules/monitoring_base/**'
              - 'modules/security_base/**'
            factory:
              - 'governance/admin/factory/**'
              - 'modules/project_factory/**'
              - 'modules/vpc_base/**'
            inventory_changed:
              - 'governance/admin/factory/inventory.json'
            workflow:
              - '.github/workflows/platform-admin.yml'

  # 1. 基盤（Foundation）のデプロイ
  deploy-foundation:
    name: 'Apply Foundation'
    needs: check-changes
    if: needs.check-changes.outputs.foundation == 'true' || needs.check-changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: governance/admin/foundation
    env:
      TF_VAR_project_id:         ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_org_id:             ${{ secrets.GCP_ORG_ID }}
      TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_gh_org_name:        ${{ vars.GH_ORG_NAME }}
      TF_VAR_gh_repo_name:       ${{ github.event.repository.name }}
      TF_VAR_app_base_name:      ${{ vars.APP_BASE_NAME }}
      TF_VAR_region:             ${{ vars.GCP_REGION }}
      TF_VAR_env:                "admin"
      TF_VAR_admin_group_email:  ${{ vars.ADMIN_GROUP_EMAIL }}
      TF_VAR_project_owner:      ${{ vars.PROJECT_OWNER }}
      TF_VAR_allowed_gh_repositories: '["${{ github.event.repository.name }}"]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Authenticate
        uses: google-github-actions/auth@v2
        with:
          project_id: '${{ vars.GCP_PROJECT_ID }}'
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/gh-actions-pool/providers/gh-provider'
          service_account: 'prd-terraform-runner-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Apply
        run: |
          cat <<EOF > backend.hcl
          bucket = "${{ vars.GCP_PROJECT_ID }}-tfstate"
          prefix = "terraform/admin/foundation/state"
          EOF
          terraform init -backend-config=backend.hcl
          terraform apply -auto-approve -input=false

  # 2. 工場（Factory）のデプロイ
  deploy-factory:
    name: 'Apply Factory'
    needs: [check-changes, deploy-foundation]
    # 💡 インベントリ変更時も確実に実行されるよう条件を網羅
    if: always() && !cancelled() && (needs.check-changes.outputs.factory == 'true' || needs.check-changes.outputs.inventory_changed == 'true' || needs.check-changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: governance/admin/factory
    env:
      TF_VAR_project_id:         ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_org_id:             ${{ secrets.GCP_ORG_ID }}
      TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_gh_org_name:        ${{ vars.GH_ORG_NAME }}
      TF_VAR_gh_repo_name:       ${{ github.event.repository.name }}
      TF_VAR_app_base_name:      ${{ vars.APP_BASE_NAME }}
      TF_VAR_region:             ${{ vars.GCP_REGION }}
      TF_VAR_env:                "admin"
      TF_VAR_admin_group_email:  ${{ vars.ADMIN_GROUP_EMAIL }}
      TF_VAR_project_owner:      ${{ vars.PROJECT_OWNER }}
      TF_VAR_allowed_gh_repositories: '["${{ github.event.repository.name }}"]'
      TF_VAR_enable_budget_pubsub: true
    steps:
      - name: Check Foundation Status
        if: needs.deploy-foundation.result == 'failure'
        run: exit 1
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Authenticate
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: '${{ vars.GCP_PROJECT_ID }}'
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/gh-actions-pool/providers/gh-provider'
          service_account: 'prd-terraform-runner-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Apply
        run: |
          cat <<EOF > backend.hcl
          bucket = "${{ vars.GCP_PROJECT_ID }}-tfstate"
          prefix = "terraform/admin/factory/state"
          EOF
          terraform init -backend-config=backend.hcl
          terraform apply -auto-approve -input=false
      - name: Extract Project IDs
        run: |
          PROJECTS_JSON=$(terraform output -json created_project_ids)
          echo "PROJECTS_JSON=$PROJECTS_JSON" >> $GITHUB_ENV

      # ---------------------------------------------------------------
      # 🚀 通知・同期・ブランチ保護 設定ステップ
      # ---------------------------------------------------------------
      - name: Notify, Sync, and Setup Protection
        if: success() && github.ref == 'refs/heads/main' && (needs.check-changes.outputs.inventory_changed == 'true' || github.event_name == 'workflow_dispatch')
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          PROJECTS_JSON: ${{ env.PROJECTS_JSON }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
        run: |
          set -e
          # ---------------------------------------------------------------
          # 1. Python スクリプトの実行 (通知＆変数同期)
          # ---------------------------------------------------------------
          echo "--- Running Python script for notification and variable sync ---"

          # 必要な認証情報を環境変数にエクスポート
          export SLACK_WEBHOOK_URL=$(gcloud secrets versions access latest --secret="infra-sandbox-slack-webhook" --project="${{ vars.GCP_PROJECT_ID }}")
          export DEPLOY_SLACK_WEBHOOK_URL=$(gcloud secrets versions access latest --secret="infra-deploy-slack-webhook" --project="${{ vars.GCP_PROJECT_ID }}")
          export GITHUB_APP_ID=$(gcloud secrets versions access latest --secret="infra-github-app-id" --project="${{ vars.GCP_PROJECT_ID }}")
          export GITHUB_APP_PRIVATE_KEY=$(gcloud secrets versions access latest --secret="infra-github-app-private-key" --project="${{ vars.GCP_PROJECT_ID }}")
          export GITHUB_APP_INSTALLATION_ID=$(gcloud secrets versions access latest --secret="infra-github-app-installation-id" --project="${{ vars.GCP_PROJECT_ID }}")
          export GITHUB_TOKEN=$(gcloud secrets versions access latest --secret="infra-github-token" --project="${{ vars.GCP_PROJECT_ID }}")

          # 変更前のインベントリを取得
          git show HEAD^:governance/admin/factory/inventory.json > inventory_old.json 2>/dev/null || echo '{"apps":{},"sandboxes":{}}' > inventory_old.json

          # Python スクリプトの依存関係をインストール
          pip install "pyjwt<3.0.0" "requests<3.0.0"

          # スクリプトを実行
          python3 $GITHUB_WORKSPACE/scripts/notify_inventory_changes.py

          # ---------------------------------------------------------------
          # 2. ブランチ保護ルールの設定
          # ---------------------------------------------------------------
          echo "--- Setting up branch protection for new repositories ---"
          
          OLD_INVENTORY="inventory_old.json"
          NEW_INVENTORY="governance/admin/factory/inventory.json"

          # 新旧インベントリからリポジトリリストを抽出・ソート
          jq -r '(.apps // {}) | to_entries[] | .value.github_repo // empty | select(. != "")' "$NEW_INVENTORY" | sort > new_app_repos.txt
          jq -r '(.apps // {}) | to_entries[] | .value.github_repo // empty | select(. != "")' "$OLD_INVENTORY" | sort > old_app_repos.txt
          
          jq -r '(.sandboxes // {}) | to_entries[] | .value.github_repo // empty | select(. != "")' "$NEW_INVENTORY" | sort > new_sandbox_repos.txt
          jq -r '(.sandboxes // {}) | to_entries[] | .value.github_repo // empty | select(. != "")' "$OLD_INVENTORY" | sort > old_sandbox_repos.txt

          # 新しく追加されたリポジトリのみを抽出
          NEW_APPS=$(comm -23 new_app_repos.txt old_app_repos.txt)
          NEW_SANDBOXES=$(comm -23 new_sandbox_repos.txt old_sandbox_repos.txt)

          if [ -z "$NEW_APPS" ] && [ -z "$NEW_SANDBOXES" ]; then
            echo "No new repositories detected. Skipping branch protection setup."
            exit 0
          fi
          
          # スクリプトに GitHub App トークンを使うよう指示
          export USE_GITHUB_APP_TOKEN="true"

          for repo in $NEW_APPS; do
            if [ -n "$repo" ]; then
              echo "Setting up branch protection for App repo: $repo"
              bash $GITHUB_WORKSPACE/scripts/setup_required_checks.sh --repo "$repo"
            fi
          done

          for repo in $NEW_SANDBOXES; do
            if [ -n "$repo" ]; then
              echo "Setting up branch protection for Sandbox repo: $repo"
              bash $GITHUB_WORKSPACE/scripts/setup_required_checks.sh --repo "$repo" --with-sandbox-critical
            fi
          done

