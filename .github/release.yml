changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: "🚀 新機能"
      labels:
        - enhancement
    - title: "🐛 バグ修正"
      labels:
        - bug
    - title: "📖 ドキュメント"
      labels:
        - documentation
    - title: "🙋 コントリビューター募集"
      labels:
        - help wanted
        - good first issue
    - title: "🔧 その他の変更"
      labels:
        - "*"
